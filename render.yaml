# Blueprint de Render: New + > Blueprint > elegir este repo.
# Los valores con sync:false se capturan en el dashboard (secretos, no van en git).
services:
  - type: web
    name: agrolink-lite-api
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - { key: APP_NAME, value: AgroLink }
      - { key: APP_ENV, value: production }
      - { key: APP_DEBUG, value: "false" }
      - { key: APP_LOCALE, value: es }
      - { key: APP_KEY, sync: false }
      - { key: APP_URL, sync: false }          # https://agrolink-lite-api.onrender.com
      - { key: LOG_CHANNEL, value: stderr }
      - { key: LOG_LEVEL, value: warning }
      - { key: DB_CONNECTION, value: pgsql }
      - { key: DB_HOST, sync: false }
      - { key: DB_PORT, value: "5432" }
      - { key: DB_DATABASE, value: postgres }
      - { key: DB_USERNAME, sync: false }
      - { key: DB_PASSWORD, sync: false }
      - { key: DB_SSLMODE, value: require }
      - { key: DB_SEARCH_PATH, value: "public,extensions" }
      - { key: SESSION_DRIVER, value: database }
      - { key: CACHE_STORE, value: database }
      - { key: QUEUE_CONNECTION, value: database }
      - { key: FILESYSTEM_DISK, value: s3 }
      - { key: AWS_ACCESS_KEY_ID, sync: false }
      - { key: AWS_SECRET_ACCESS_KEY, sync: false }
      - { key: AWS_DEFAULT_REGION, sync: false }
      - { key: AWS_BUCKET, value: listings }
      - { key: VERIFICATION_BUCKET, sync: false }   # bucket PRIVADO para INE/comprobantes
      - { key: AWS_ENDPOINT, sync: false }
      - { key: AWS_URL, sync: false }
      - { key: AWS_USE_PATH_STYLE_ENDPOINT, value: "true" }
      # Opcionales, solo para el primer arranque (bórralas después):
      - { key: ADMIN_EMAIL, sync: false }
      - { key: MODERATOR_EMAILS, sync: false }
      - { key: ADMIN_NAME, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
      # Confirmación de cuenta por correo (Resend). Valores en el dashboard.
      - { key: RESEND_KEY, sync: false }
      - { key: RESEND_FROM, sync: false }
      - { key: EMAIL_VERIFICATION_REQUIRED, value: "false" }   # pon "true" cuando Resend tenga dominio verificado
